<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Document setup and stylesheet linking -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spielboard - Menu</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
  <!-- --- Video Background (disabled) --- -->
  <!-- Renders an immersive, looping background video behind the main user interface. 
       The overlay div is typically used to darken or tint the video so the text remains readable. -->
  <div class="video-background">
    <video autoplay loop muted playsinline>
      <source src="assets/media/shark_swim.mov" type="video/quicktime">
      Dein Browser unterstützt keine Videos.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- --- Main Navigation --- -->
  <!-- Top navigation bar providing quick access to the home menu, the storyboarding tool, and session termination. -->
  <nav class="main-nav">
    <a href="index.html" class="nav-icon active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
    </a>
    <a href="storyboard.html" class="nav-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
        <path d="m6.2 5.3 3.1 3.9" />
        <path d="m12.4 3.4 3.1 4" />
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
      </svg>
    </a>
    <a href="#" id="logout-btn" class="nav-icon" title="Neue Session starten"
      style="margin-left: 2rem; color: var(--color-danger);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </a>
  </nav>

  <!-- --- Main Menu Board --- -->
  <!-- Displays the primary entry point for the application, guiding the user to the core storyboarding tool. -->
  <div class="page-container" style="padding: 20px 32px 48px;">
    <h1 class="main-title neon-text">Spielboard</h1>
    <p class="subtitle">Build the foundation of your movies here</p>
    
    <div class="grid-container" style="grid-template-columns: 1fr; max-width: 700px; height: 500px; margin-top: 50px;">
      <!-- Large interactive card linking directly to the storyboard interface -->
      <a href="storyboard.html" class="card card-link card-small" style="height: 400px;">
        <div class="card-icon-wrapper">
          <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="var(--color-purple)" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
            <path d="m6.2 5.3 3.1 3.9" />
            <path d="m12.4 3.4 3.1 4" />
            <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
          </svg>
        </div>
        <span class="card-badge">Create Storyboard</span>
      </a>
    </div>
    
  </div>

  <!-- --- Session Management --- -->
  <!-- Handles the logout process by clearing the active session_id from the browser's local storage 
       and returning the user to the login screen for next user. -->
  <script>
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', (e) => {
        e.preventDefault(); // Verhindert, dass der Link normal öffnet
        const confirmReset = confirm("Do you really want to exit this session?");
        if (confirmReset) {
          // Löscht die aktuelle Session aus dem Speicher des Browsers
          localStorage.removeItem('session_id');
          // Leitet zurück zur Login-Seite
          window.location.href = 'start.html';
        }
      });
    }
  </script>
</body>

</html>
