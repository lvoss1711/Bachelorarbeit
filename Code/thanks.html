<!DOCTYPE html>
<html lang="en">
<head>
  <!-- --- Document Setup & Styles --- -->
  <meta charset="UTF-8" />
  <title>Spielboard - Thank You</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0;">

  <!-- --- Top Navigation & Logout --- -->
  <!-- Provides a dedicated button to securely terminate the current participant's session and clear local data. -->
  <nav class="main-nav" style="justify-content: flex-end; padding-right: 2rem;">
    <a href="#" id="end-session-btn" class="btn-primary" style="background: var(--color-danger); color: white; text-decoration: none; display: flex; align-items: center; font-size: 1rem;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.5rem;">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      End Session & Logout
    </a>
  </nav>

  <!-- --- Success Message Container --- -->
  <!-- Displays the final thank-you message indicating the successful completion of the study. -->
  <div class="card" style="width: 100%; max-width: 700px; text-align: center; padding: 4rem 2rem;">
    <div style="background: rgba(255,255,255,0.1); width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem auto; border: 3px solid var(--color-yellow);">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="var(--color-yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
    </div>
    
    <h1 class="neon-text" style="font-size: 4rem; margin-bottom: 1.5rem; line-height: 1.2;">Thanks for<br>participating!</h1>
    <p style="font-size: 1.2rem; color: rgba(255,255,255,0.8);">Your contribution to this study has been successfully recorded.</p>
  </div>

  <script>
    // --- Session Termination Logic ---
    // Clears the active session ID from the browser's local storage and redirects to the initial welcome screen, resetting the environment for the next participant.
    document.getElementById('end-session-btn').addEventListener('click', (e) => {
      e.preventDefault();
      
      localStorage.removeItem('session_id');
      
      window.location.href = 'welcome.html';
    });
  </script>
</body>
</html>
