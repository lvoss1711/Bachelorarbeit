<!DOCTYPE html>
<html lang="en">
<head>
  <!-- --- Document Setup & Styles --- -->
  <meta charset="UTF-8" />
  <title>Spielboard - Studie Login</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  
  <!-- --- Login Form Container --- -->
  <!-- Centered card layout for the participant login screen. -->
  <div class="card" style="width: 600px; text-align: center; padding: 48px;">
    <!-- User Icon Illustration -->
    <div style="background: rgba(255,255,255,0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; border: 4px solid var(--color-yellow);">
       <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="var(--color-yellow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <circle cx="12" cy="8" r="5" />
  <path d="M20 21a8 8 0 0 0-16 0" />
</svg>
    </div>
    
    <h1 class="neon-text" style="font-size: 4.5rem;">Login</h1>
    <!-- Proband ID input field (each participant is given a unique ID at the beginning of the study) -->
    <input type="text" id="proband-id" autocomplete="off" class="input-field" placeholder="Enter your ProbID here..." style="width: 90%; margin-bottom: 0; font-size: 1.2rem;" />
    <!-- Start study submission button -->
    <button id="start-btn" class="btn-primary" style="width: 50%; font-size: 1.5rem; padding: 16px; margin-top: 1.5rem;">Start study</button>
  </div>

  <script>
    // --- Initial Supervisor Modal ---
    // Automatically displays a popup modal directly upon page load to instruct participants 
    // to inform the study supervisor before beginning.
    document.addEventListener('DOMContentLoaded', () => {
      function showInitialModal() {
        const overlay = document.createElement('div');
        overlay.className = 'custom-modal-overlay';
        const modal = document.createElement('div');
        modal.className = 'custom-modal';

        const text = document.createElement('p');
        text.innerText = "Inform the study supervisor.";
        text.style.fontWeight = "bold";
        text.style.fontSize = "2rem";
        text.style.marginBottom = "1.5rem";

        const btnContainer = document.createElement('div');
        btnContainer.style.display = "flex";

        const okBtn = document.createElement('button');
        okBtn.className = 'btn-primary';
        okBtn.style.width = "100%";
        okBtn.style.fontSize = "20px";
        okBtn.style.background = '#4BADB5';
        okBtn.style.color = 'white';
        okBtn.innerText = 'OK';

        btnContainer.appendChild(okBtn);
        modal.appendChild(text);
        modal.appendChild(btnContainer);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        // Trigger fade-in animation
        setTimeout(() => overlay.classList.add('active'), 10);

        // Dismiss modal on click
        okBtn.addEventListener('click', () => { 
            overlay.classList.remove('active');
            setTimeout(() => overlay.remove(), 300); 
        });
      }

      // Invoke modal generation immediately
      showInitialModal();
    });

    // --- Session Login Logic ---
    // Handles validation of the participant ID and communicates with the PHP backend 
    // to initialize a new tracking session.
    document.getElementById('start-btn').addEventListener('click', async () => {
      const probandId = document.getElementById('proband-id').value.trim();
      if (!probandId) return alert("Bitte eine ID eingeben.");

      const response = await fetch('api.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'start_session', proband_id: probandId })
      });
      const data = await response.json();

      if (data.success) {
        // Persist the unique session ID in browser local storage to survive page refreshes
        localStorage.setItem('session_id', data.session_id);
        window.location.href = 'index.html'; // Redirect to the main menu
      } else {
        alert("Fehler: " + data.error);
      }
    });
  </script>
</body>
<!-- http://localhost/Bachelorarbeit/start.html -->
</html>
