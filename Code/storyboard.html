<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Document setup and stylesheet linking -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spielboard - Storyboard</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <!-- Main navigation bar with SVG icons for routing (Home, Storyboard) and session termination (Logout) -->
  <nav class="main-nav">
    <a href="index.html" class="nav-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </a>
    <a href="storyboard.html" class="nav-icon active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/><path d="m6.2 5.3 3.1 3.9"/><path d="m12.4 3.4 3.1 4"/><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
      </svg>
    </a>
    <a href="#" id="logout-btn" class="nav-icon" title="Neue Session starten" style="margin-left: 2rem; color: var(--color-danger);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </a>
  </nav>

  <!-- Floating action buttons for study progression. 
       These are hidden by default and dynamically toggled by the JavaScript logic 
       depending on the user's current session state (e.g., moving from introduction to main tasks). -->
  <button id="continue-tasks-btn" class="btn-primary hidden" style="position: fixed; bottom: 2rem; right: 2rem; background: #4BADB5; color: white; text-decoration: none; box-shadow: 0 10px 15px rgba(0,0,0,0.4); z-index: 100; font-size: 1.2rem; padding: 1rem 1.5rem; border-radius: 1rem; border: 2px solid rgba(255,255,255,0.2); cursor: pointer;">
    Continue to Tasks
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.5rem;">
      <path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path>
    </svg>
  </button>

  <a href="overview.html" id="finish-btn" class="btn-primary hidden" style="position: fixed; bottom: 2rem; right: 2rem; background: var(--color-danger); color: white; text-decoration: none; box-shadow: 0 10px 15px rgba(0,0,0,0.4); z-index: 100; font-size: 1.2rem; padding: 1rem 1.5rem; border-radius: 1rem; border: 2px solid rgba(255,255,255,0.2);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.5rem;">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
      <line x1="3" y1="9" x2="21" y2="9"></line>
      <line x1="9" y1="21" x2="9" y2="9"></line>
    </svg>
    Finish & Overview
  </a>
  
  <!-- Core storyboarding interface -->
  <div class="page-container">
    <h1 class="main-title neon-text" style="margin-bottom: 0.5rem;">Storyboard</h1>
    <!-- Task title placeholder, injected dynamically by JavaScript depending on the study flow -->
    <h2 id="task-title" style="text-align: center; color: var(--color-yellow); margin-bottom: 2rem; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px;"></h2>

    <!-- Main container for dynamically generated scenes and frames. 
         It is pre-populated with an initial empty 'Scene 1' structure to ensure the DOM has a mounting point for the first frames. -->
    <div id="scenes-container" class="scene-block">
      
      <div class="scene-block" data-scene-id="1">
        <h2 class="scene-title">Scene 1</h2>
        
        <div class="scene-container">
          <div class="frames-wrapper">
            
            <button class="btn-add-frame">
              <svg class="plus" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="#85C6CC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
              <span>Add Frame</span>
            </button>

          </div>
        </div>
      </div>

    </div>
    
    <!-- Button to append a new scene block to the scenes-container -->
    <button id="add-scene-btn" class="btn-add-scene">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        Add Scene
    </button>
  </div>

  <!-- External logic for API calls, ComfyUI generation, and UI state management -->
  <script src="assets/js/storyboard.js?v=2"></script>
  
  <!-- Inline script for session teardown. 
       Clears the local storage and redirects to the start page to have a clean slate for the next participant. -->
  <script>
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', (e) => {
        e.preventDefault(); 
        const confirmReset = confirm("Möchtest du diese Session wirklich beenden und eine neue starten?");
        if (confirmReset) {
          localStorage.removeItem('session_id');
          window.location.href = 'start.html';
        }
      });
    }
  </script>
</body>
<!-- http://localhost/Bachelorarbeit/storyboard.html -->
</html>
