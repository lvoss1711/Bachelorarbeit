<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Document setup and stylesheet linking -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spielboard - Characters</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

  <!-- Main navigation bar with SVG icons for routing (Home, Character, Storyboard) and session termination (Logout) -->
  <nav class="main-nav">
    <a href="index.html" class="nav-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        <polyline points="9 22 9 12 15 12 15 22" />
      </svg>
    </a>
    <a href="character.html" class="nav-icon active">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
        <circle cx="9" cy="7" r="4" />
        <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
      </svg>
    </a>
    <a href="storyboard.html" class="nav-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" />
        <path d="m6.2 5.3 3.1 3.9" />
        <path d="m12.4 3.4 3.1 4" />
        <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" />
      </svg>
    </a>
    <a href="#" id="logout-btn" class="nav-icon" title="Neue Session starten" style="margin-left: 2rem; color: var(--color-danger);">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </a>
  </nav>

  <!-- Main container for the character creation interface -->
  <div class="page-container">
    <h1 class="main-title neon-text">Character</h1>

    <!-- Grid layout that holds the creation form and will dynamically append saved characters -->
    <div id="character-grid" class="grid-container">

      <!-- Character Creation Card -->
      <div class="card card-tall" style="height: auto; min-height: 400px;">

        <!-- Image Upload Section for Portrait and Fullbody References -->
        <div style="display: flex; gap: 1rem; width: 100%; height: 200px;">

          <label class="upload-area">
            <div id="upload-placeholder-portrait" style="display: flex; flex-direction: column; align-items: center;">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
              </svg>
              <span style="font-size: 0.8rem; margin-top: 0.5rem;">Portrait</span>
            </div>
            <img id="image-preview-portrait" src="" alt="Portrait" class="image-preview hidden" />
            <input type="file" id="file-input-portrait" class="hidden" accept="image/*" />
          </label>

          <label class="upload-area">
            <div id="upload-placeholder-fullbody" style="display: flex; flex-direction: column; align-items: center;">
              <svg width="32" height="32" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
                <circle cx="256" cy="56" r="40" fill="none" stroke="var(--color-purple)" stroke-miterlimit="10"
                  stroke-width="35"></circle>
                <path
                  d="M199.3,295.62h0l-30.4,172.2a24,24,0,0,0,19.5,27.8,23.76,23.76,0,0,0,27.6-19.5l21-119.9v.2s5.2-32.5,17.5-32.5h3.1c12.5,0,17.5,32.5,17.5,32.5v-.1l21,119.9a23.92,23.92,0,1,0,47.1-8.4l-30.4-172.2-4.9-29.7c-2.9-18.1-4.2-47.6.5-59.7,4-10.4,14.13-14.2,23.2-14.2H424a24,24,0,0,0,0-48H88a24,24,0,0,0,0,48h92.5c9.23,0,19.2,3.8,23.2,14.2,4.7,12.1,3.4,41.6.5,59.7Z"
                  fill="none" stroke="var(--color-purple)" stroke-miterlimit="10" stroke-width="35"></path>
              </svg>
              <span style="font-size: 0.8rem; margin-top: 0.5rem;">Full body</span>
            </div>
            <img id="image-preview-fullbody" src="" alt="Fullbody" class="image-preview hidden" />
            <input type="file" id="file-input-fullbody" class="hidden" accept="image/*" />
          </label>

        </div>

        <!-- Input Section for Character Metadata (Name and Gender) -->
        <div class="input-group">
          <input type="text" id="name-input" spellcheck="false" placeholder="Insert Name" class="input-field" />
          
          <select id="gender-input" class="input-field" style="max-width: 150px; cursor: pointer;">
            <option value="male">Männlich</option>
            <option value="female">Weiblich</option>
          </select>

          <!-- Submit Button (Disabled by default until validation passes) -->
          <button id="add-btn" class="btn-primary" disabled>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
        </div>

      </div>
    </div>
    
   <!-- Navigation button to proceed to the core storyboarding tool -->
   <a href="storyboard.html" class="btn-add-scene"
    style="text-decoration: none; margin-top: 3rem; width: auto; padding-left: 3rem; padding-right: 3rem;">
    Continue to Storyboard
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14" />
      <path d="m12 5 7 7-7 7" />
    </svg>
  </a>

  </div>
  
  <!-- External logic for API calls, image processing, and dynamic DOM updates -->
  <script src="assets/js/character.js"></script>
  
  <!-- Inline script for session teardown. 
       Clears the local storage and redirects to the start page to have a clean slate for the next user. -->
  <script>
    const logoutBtn = document.getElementById('logout-btn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        const confirmReset = confirm("Möchtest du diese Session wirklich beenden und eine neue starten?");
        if (confirmReset) {
          localStorage.removeItem('session_id');

          window.location.href = 'start.html';
        }
      });
    }
  </script>
</body>

</html>
