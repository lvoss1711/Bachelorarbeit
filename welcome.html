<!DOCTYPE html>
<html lang="en">
<head>
  <!-- --- Document Setup & Styles --- -->
  <meta charset="UTF-8" />
  <title>Spielboard - Welcome</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  
  <!-- --- Welcome Screen Container --- -->
  <!-- Displays the initial greeting and sets the context for the participant before the study begins. -->
  <div class="card" style="width: 600px; text-align: center; padding: 3rem;">
    
    <!-- Decorative Document Icon -->
    <div style="background: rgba(255,255,255,0.1); width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; border: 4px solid var(--color-yellow);">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--color-yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
    </div>
    
    <h1 class="neon-text" style="font-size: 4.5rem;">Welcome</h1>
    
    <!-- --- Introduction Text --- -->
    <!-- Informs the participant that preliminary demographic information is needed. -->
    <p style="margin-bottom: 0.8rem; padding: 15px; font-size: 1.2rem; color: rgba(213, 235, 250, 0.897); line-height: 1.6; background-color:  #142a3fc9; border-radius: 20px; font-weight: 600;">
      Before starting with the study, I would like to know a little more about you.
    </p>
    
    <!-- --- Navigation Action --- -->
    <!-- Routes the user directly to the demographics questionnaire (demoqu.html) to collect background data. -->
    <a href="demoqu.html" class="btn-primary" style="text-decoration: none; width: 40%; font-size: 1.5rem; padding: 1rem;">
      Next
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 0.1rem;">
        <line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

</body>
<!-- http://localhost/Bachelorarbeit/welcome.html -->
</html>
